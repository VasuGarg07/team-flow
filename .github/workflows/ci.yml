name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: teamflow
          POSTGRES_PASSWORD: teamflow
          POSTGRES_DB: teamflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamflow -d teamflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PORT: 8000
      DATABASE_URL: postgresql+psycopg://teamflow:teamflow@localhost:5432/teamflow
      TEST_DATABASE_URL: postgresql+psycopg://teamflow:teamflow@localhost:5432/teamflow_test
      JWT_SECRET_KEY: ci-only-key-not-a-real-secret-0123456789
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      COOKIE_SECURE: "false"
      REDIS_URL: redis://localhost:6379/0
      UPLOAD_DIR: uploads
      MAX_UPLOAD_BYTES: 5242880
      CORS_ORIGINS: '["http://localhost:5173"]'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t teamflow-backend ./backend
      - run: docker build -t teamflow-frontend ./frontend